[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-review-scheduler"
version = "0.1.0"
description = "Model-driven material review and draft scheduling agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
review-scheduler = "review_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
